name: Fix SEO Consistency
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical, 404, and sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('about.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('href="https://cargouncle.com/about"','href="https://cargouncle.com/about.html"')
              p.write_text(s,encoding='utf-8')
          p=Path('404.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('<meta name="robots" content="index,follow,max-image-preview:large">','<meta name="robots" content="noindex,follow">')
              s=s.replace('<link rel="canonical" href="https://cargouncle.com/404">','')
              p.write_text(s,encoding='utf-8')
          p=Path('sitemap.xml')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('https://cargouncle.com/about</loc>','https://cargouncle.com/about.html</loc>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-seo-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html 404.html sitemap.xml .github/workflows/fix-seo-consistency.yml
          git diff --cached --quiet || git commit -m "Fix SEO canonical and 404 indexing"
          git push
